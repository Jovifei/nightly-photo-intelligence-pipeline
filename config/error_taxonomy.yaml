schema_version: "1.0"
errors:
  NPI_GATE_NOT_AUTHORIZED:
    exit_code: 8
    severity: "INFO"
  NPI_SOURCE_RUNTIME_OVERLAP:
    exit_code: 4
    severity: "CRITICAL"
  NPI_SOURCE_SYMLINK_ESCAPE:
    exit_code: 4
    severity: "CRITICAL"
  NPI_SOURCE_CHANGED_DURING_READ:
    exit_code: 4
    severity: "CRITICAL"
  NPI_UNSUPPORTED_MEDIA:
    exit_code: 7
    severity: "WARNING"
  NPI_DATABASE_ERROR:
    exit_code: 6
    severity: "ERROR"
  NPI_SCHEMA_INVALID:
    exit_code: 5
    severity: "ERROR"
  NPI_HANDOFF_INTEGRITY_FAILED:
    exit_code: 9
    severity: "CRITICAL"
  NPI_PROMOTION_REPARSE_POINT_REJECTED:
    exit_code: 4
    severity: "CRITICAL"
  NPI_PROMOTION_BOUND_ROOT_IDENTITY_CHANGED:
    exit_code: 4
    severity: "CRITICAL"
  NPI_PROMOTION_PATH_ESCAPED_BOUND_ROOT:
    exit_code: 4
    severity: "CRITICAL"
  NPI_PROMOTION_VOLUME_IDENTITY_CHANGED:
    exit_code: 4
    severity: "CRITICAL"
  NPI_PROMOTION_RACE_DETECTED:
    exit_code: 4
    severity: "CRITICAL"
  NPI_PROMOTION_RACE_RESISTANT_PATH_OPERATION_UNAVAILABLE:
    exit_code: 3
    severity: "CRITICAL"
  NPI_INTERNAL_ERROR:
    exit_code: 10
    severity: "ERROR"
redaction:
  path: "<SOURCE_ROOT>/<RELATIVE_OR_HASHED_NAME>"
  hostname: "<HOST_REDACTED>"
  username: "<USER_REDACTED>"
  token: "<SECRET_REDACTED>"
