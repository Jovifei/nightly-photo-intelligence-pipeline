schema_version: "1.0"
states:
  - NEW
  - INGESTED
  - DUPLICATE
  - UNSUPPORTED
  - POSE_DONE
  - SEGMENT_DONE
  - FACTS_DONE
  - INTERPRETATION_DONE
  - PROMPTS_DONE
  - VALIDATED
  - NEEDS_REVIEW
  - APPROVED
  - EXPORTED
  - RETRY
  - FAILED
transitions:
  NEW: [INGESTED, DUPLICATE, UNSUPPORTED, FAILED]
  INGESTED: [POSE_DONE, NEEDS_REVIEW, RETRY, FAILED]
  POSE_DONE: [SEGMENT_DONE, NEEDS_REVIEW, RETRY, FAILED]
  SEGMENT_DONE: [FACTS_DONE, NEEDS_REVIEW, RETRY, FAILED]
  FACTS_DONE: [INTERPRETATION_DONE, NEEDS_REVIEW, RETRY, FAILED]
  INTERPRETATION_DONE: [PROMPTS_DONE, NEEDS_REVIEW, RETRY, FAILED]
  PROMPTS_DONE: [VALIDATED, NEEDS_REVIEW, RETRY, FAILED]
  VALIDATED: [NEEDS_REVIEW, APPROVED]
  NEEDS_REVIEW: [APPROVED, FAILED, INGESTED, POSE_DONE, SEGMENT_DONE, FACTS_DONE, INTERPRETATION_DONE, PROMPTS_DONE]
  APPROVED: [EXPORTED]
  RETRY: [INGESTED, POSE_DONE, SEGMENT_DONE, FACTS_DONE, INTERPRETATION_DONE, PROMPTS_DONE, FAILED]
  DUPLICATE: []
  UNSUPPORTED: []
  EXPORTED: []
  FAILED: []
rules:
  - "Transition history is append-only."
  - "Human actor required for transition to APPROVED."
  - "EXPORTED requires immutable release id and item checksum."
  - "A new analysis version creates a new run; it does not erase history."
