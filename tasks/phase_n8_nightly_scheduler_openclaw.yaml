prerequisites:
  - "N7 owner approval"
  - "100 pilot accepted"
  - "N8 task authorization"
  - "least privilege negative test plan"
forbidden_while_locked:
  - "automatic_openclaw_activation"
  - "docker_socket_to_openclaw"
  - "raw_photos_to_openclaw"
  - "full_run_without_G3"
  - "admin_rights"
completion_does_not:
  - "authorize_next_phase"
  - "authorize_larger_data_gate"
  - "authorize_model_download"
  - "authorize_openclaw"
mandatory_stop:
  value: true
  rule: "完成本阶段后停止并等待 Owner；不得自动推进。"
