contract_version: "1.0"
phase:
  id: "N8"
  title: "夜间调度、全量准备与受限 OpenClaw"
  status: "LOCKED"
data_gate:
  id: "G2_PILOT_100"
  status: "LOCKED_OR_SEPARATELY_CONTROLLED"
