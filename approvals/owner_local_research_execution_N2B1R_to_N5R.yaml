  - phase: "N2B1P"
    condition: "Each quarantined artifact has an approved-register identity, bounded official-domain transfer record, local SHA-256, post-write reread, and cache-promotion verification."
  - phase: "N2B2"
    condition: "N2B1R/N2B1P complete; isolated CUDA, ACL, manifest, source/runtime separation, source hash, schema, resource, and quality gates pass."
  - phase: "N3A"
